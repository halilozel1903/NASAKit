<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="NASAKit: a Swift client for NASA's open APIs with an Apple TV and iPhone app" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffc58f"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121b33"/>
      <stop offset="1" stop-color="#0c1428"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#sky)"/>

  <!-- Orbits (abstract) -->
  <g transform="translate(1120 140) rotate(-24)" fill="none" stroke="#5aaeff" stroke-opacity="0.55">
    <ellipse rx="190" ry="64" stroke-width="3"/>
    <ellipse rx="250" ry="88" stroke-width="2" stroke-opacity="0.35"/>
  </g>
  <circle cx="1120" cy="140" r="54" fill="url(#planet)"/>
  <circle cx="946" cy="217" r="9" fill="#eaf4ff"/>

  <!-- Title -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-1">NASAKit</text>
  <text x="84" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#b9c6e4">Swift client for NASA's open APIs, with an Apple TV and iPhone app</text>

  <!-- Endpoint chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">
    <g transform="translate(84 236)">
      <rect width="310" height="40" rx="20" fill="#16264a" stroke="#5aaeff" stroke-opacity="0.6"/>
      <text x="155" y="26" text-anchor="middle" fill="#cfe6ff">Astronomy Picture of the Day</text>
    </g>
    <g transform="translate(408 236)">
      <rect width="205" height="40" rx="20" fill="#16264a" stroke="#5aaeff" stroke-opacity="0.6"/>
      <text x="102.5" y="26" text-anchor="middle" fill="#cfe6ff">Mars Rover Photos</text>
    </g>
    <g transform="translate(627 236)">
      <rect width="185" height="40" rx="20" fill="#16264a" stroke="#5aaeff" stroke-opacity="0.6"/>
      <text x="92.5" y="26" text-anchor="middle" fill="#cfe6ff">Asteroids NeoWs</text>
    </g>
    <g transform="translate(84 286)">
      <rect width="205" height="40" rx="20" fill="#2a1d14" stroke="#ff9e52" stroke-opacity="0.7"/>
      <text x="102.5" y="26" text-anchor="middle" fill="#ffd9b8">EPIC Earth images</text>
    </g>
    <g transform="translate(303 286)">
      <rect width="320" height="40" rx="20" fill="#2a1d14" stroke="#ff9e52" stroke-opacity="0.7"/>
      <text x="160" y="26" text-anchor="middle" fill="#ffd9b8">NASA Image and Video Library</text>
    </g>
    <text x="639" y="312" fill="#8e9bbb" font-weight="500">no API key needed</text>
  </g>

  <!-- Code card -->
  <g transform="translate(80 356)">
    <rect width="760" height="160" rx="16" fill="url(#card)" stroke="#2a3a63"/>
    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19">
      <text x="28" y="42"><tspan fill="#ff7ab2">let</tspan><tspan fill="#ffffff"> nasa = NASAClient(apiKey: </tspan><tspan fill="#fc6a5d">"DEMO_KEY"</tspan><tspan fill="#ffffff">)</tspan></text>
      <text x="28" y="76"><tspan fill="#ff7ab2">let</tspan><tspan fill="#ffffff"> today = </tspan><tspan fill="#ff7ab2">try await</tspan><tspan fill="#ffffff"> nasa.apod()</tspan></text>
      <text x="28" y="110"><tspan fill="#ff7ab2">let</tspan><tspan fill="#ffffff"> earth = </tspan><tspan fill="#ff7ab2">try await</tspan><tspan fill="#ffffff"> nasa.epicImages(.natural)</tspan></text>
      <text x="28" y="144"><tspan fill="#ff7ab2">let</tspan><tspan fill="#ffffff"> found = </tspan><tspan fill="#ff7ab2">try await</tspan><tspan fill="#ffffff"> nasa.searchMedia(</tspan><tspan fill="#fc6a5d">"apollo 11"</tspan><tspan fill="#ffffff">)</tspan></text>
    </g>
  </g>

  <!-- Platforms -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#dfe7f7">
    <g transform="translate(900 380)">
      <rect width="300" height="54" rx="14" fill="#121b33" stroke="#2a3a63"/>
      <rect x="18" y="14" width="40" height="26" rx="4" fill="none" stroke="#dfe7f7" stroke-width="2.5"/>
      <rect x="30" y="41" width="16" height="3" rx="1.5" fill="#dfe7f7"/>
      <text x="74" y="34">tvOS 17+ · Apple TV</text>
    </g>
    <g transform="translate(900 448)">
      <rect width="300" height="54" rx="14" fill="#121b33" stroke="#2a3a63"/>
      <rect x="29" y="11" width="18" height="32" rx="4" fill="none" stroke="#dfe7f7" stroke-width="2.5"/>
      <text x="74" y="34">iOS 17+ · iPhone</text>
    </g>
  </g>
  <text x="1200" y="536" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6f7c9c">Unofficial. Not affiliated with or endorsed by NASA.</text>
</svg>
