name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test:
    name: Tests (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    steps:
      - uses: actions/checkout@v5
      - name: Build & test on ${{ matrix.platform }} Simulator
        run: bash scripts/test.sh ${{ matrix.platform }}

  example:
    name: Example apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install tvOS platform if missing
        run: |
          if ! xcrun simctl list runtimes available | grep -q tvOS; then
            xcodebuild -downloadPlatform tvOS
          fi
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Build for tvOS Simulator
        run: |
          xcodebuild build \
            -project Example/NASAKitDemo.xcodeproj \
            -scheme OrbitTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Example/NASAKitDemo.xcodeproj \
            -scheme OrbitPhone \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: [swift, test, example]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Capture screenshots (Apple TV and iPhone)
        # Live data only. The scenes use the keyless EPIC and NASA Image and Video Library APIs;
        # the apod scenes run only when the repository has a NASA_API_KEY secret (DEMO_KEY is
        # limited per IP address and runners share addresses), and are skipped otherwise.
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: >-
          bash scripts/screenshots.sh NASAKitDemo
          --tv OrbitTV io.github.halilozel1903.OrbitTV home earth apod
          --iphone OrbitPhone io.github.halilozel1903.OrbitPhone search detail earth apod
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
